name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile every source file
        run: python -m compileall -q .

      - name: Shell script syntax
        run: |
          for f in *.sh; do
            echo "checking $f"
            bash -n "$f"
          done

      # selftest.py refuses to run without a .env, and validates that API_HASH is
      # 32 characters. These are placeholders: every check below is offline, and
      # --connect (the only step that talks to Telegram) is deliberately not used.
      - name: Synthesise credentials for the offline self-test
        run: |
          test -f .env.example
          test -f targets.txt.example
          printf 'API_ID=12345\nAPI_HASH=00000000000000000000000000000000\n' > .env

      - name: Self-test - autoload, pattern conflicts, storage, notify queue
        run: python selftest.py
